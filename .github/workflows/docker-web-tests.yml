name: Build and push Docker images

on: 
  workflow_run:
    workflows: ["CMake on a single platform"]
    types:
      - completed

permissions:
  contents: write

jobs:
  deploy:
    runs-on:
      - ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        run: |
            docker build -t ${{ secrets.DOCKER_USERNAME }}/testrepo_app:${{ steps.vars.outputs.git_sha }} -f Dockerfile.app .
            docker build -t ${{ secrets.DOCKER_USERNAME }}/testrepo_web:${{ steps.vars.outputs.git_sha }} -f Dockerfile.web .
            docker push ${{ secrets.DOCKER_USERNAME }}/testrepo_app:${{ steps.vars.outputs.git_sha }}
            docker push ${{ secrets.DOCKER_USERNAME }}/testrepo_web:${{ steps.vars.outputs.git_sha }}

      - name: Helm setup
        uses: azure/setup-helm@v3
        with:
          version: v3.13.2
        
      - name: package Helm chart
        run: |
          helm package helm/test-repo-chart
          mv test-repo-chart-*.tgz test-repo-chart.tgz

      - name: Publish Helm chart
        uses: softprops/action-gh-release@v0.1.15
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          files: test-repo-chart.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}